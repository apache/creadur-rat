description: 'Eastron SDM-230 Modbus V2'
schemaFeatureLevel: 2
# Based upon https://www.eastroneurope.com/images/uploads/products/protocol/Correct_SDM230_Protocol.pdf

# The SDM230Modbus can transfer a maximum of 40 values in a single transaction;
# therefore the maximum number of registers requestable is 80.
maxRegistersPerModbusRequest: 80
blocks:
  - id: 'measurements'
    description: 'The actual measurements'
    fields:
      - id:           'Line to neutral volts'
        description:  'Line to neutral volts'
        expression:   'ieee754_32(ir:00000 # 2)'
        unit:         'Volts'

# NOTE: The addresses used in this single phase device are the same as phase 1 in a 3 phase device like the SDM630.
#       This causes unused "holes" between the defined values for a 1 phase meter like the SDM230.

      - id: 'Current'
        description: 'Current'
        expression: 'ieee754_32(ir:00006 # 2)'
        unit: 'Amps'

      - id: 'Active power'
        description: 'Active power'
        expression: 'ieee754_32(ir:00012 # 2)'
        unit: 'Watts'

      - id: 'Apparent power'
        description: 'Apparent power'
        expression: 'ieee754_32(ir:00018 # 2)'
        unit: 'VA'

      - id: 'Reactive Power'
        description: 'Reactive power'
        expression: 'ieee754_32(ir:00024 # 2)'
        unit: 'VAr'

      - id: 'Power Factor'
        description: 'Power factor. The power factor has its sign adjusted to indicate the direction of the current. Positive refers to forward current, negative refers to reverse current'
        expression: 'ieee754_32(ir:00030 # 2)'

      - id: 'Phase Angle'
        description: 'Phase angle'
        expression: 'ieee754_32(ir:00036 # 2)'
        unit: 'Degrees'

      - id: 'Frequency'
        description: 'Frequency'
        expression: 'ieee754_32(ir:00070 # 2)'
        unit: 'Hz'

      - id: 'Import active energy'
        description: 'Import active energy'
        expression: 'ieee754_32(ir:00072 # 2)'
        unit: 'kWh'

      - id: 'Export active energy'
        description: 'Total active energy'
        expression: 'ieee754_32(ir:00074 # 2)'
        unit: 'kWh'

      - id: 'Import reactive energy'
        description: 'Import reactive energy'
        expression: 'ieee754_32(ir:00076 # 2)'
        unit: 'kVArh'

      - id: 'Export reactive energy'
        description: 'Export reactive energy'
        expression: 'ieee754_32(ir:00078 # 2)'
        unit: 'kVArh'

      - id: 'Total System power demand'
        description: 'Total System power demand'
        expression: 'ieee754_32(ir:00084 # 2)'
        unit: 'W'

      - id: 'Maximum Total System power demand'
        description: 'Maximum Total System power demand'
        expression: 'ieee754_32(ir:00086 # 2)'
        unit: 'W'

      - id: 'Current system positive power demand'
        description: 'Current system positive power demand'
        expression: 'ieee754_32(ir:00088 # 2)'
        unit: 'W'

      - id: 'Maximum system positive power demand'
        description: 'Maximum system positive power demand'
        expression: 'ieee754_32(ir:00090 # 2)'
        unit: 'W'

      - id: 'Current system reverse power demand'
        description: 'Current system reverse power demand'
        expression: 'ieee754_32(ir:00092 # 2)'
        unit: 'W'

      - id: 'Maximum system reverse power demand'
        description: 'Maximum system reverse power demand'
        expression: 'ieee754_32(ir:00094 # 2)'
        unit: 'W'

      - id: 'Current demand'
        description: 'Current demand'
        expression: 'ieee754_32(ir:00258 # 2)'
        unit: 'Amps'

      - id: 'Maximum current demand'
        description: 'Maximum current demand'
        expression: 'ieee754_32(ir:00264 # 2)'
        unit: 'Amps'

      - id: 'Total active energy'
        description: 'Total active energy'
        expression: 'ieee754_32(ir:00342 # 2)'
        unit: 'kWh'

      - id: 'Total reactive energy'
        description: 'Total reactive energy'
        expression: 'ieee754_32(ir:00344 # 2)'
        unit: 'kVArh'

      - id: 'Current resettable total active energy'
        description: 'Current resettable total active energy'
        expression: 'ieee754_32(ir:00384 # 2)'
        unit: 'kWh'

      - id: 'Current resettable total reactive energy'
        description: 'Current resettable total reactive energy'
        expression: 'ieee754_32(ir:00386 # 2)'
        unit: 'kVArh'

  - id: 'digital_meter_set_up'
    description: 'Digital meter set up'
    fields:
      - id: 'Pulse output 1 width'
        description: 'Write relay on period in Milliseconds: 60, 100 or 200, default 100.'
        expression: 'ieee754_32(hr:00012 # 2)'
        unit: 'ms'

      - id: 'Network Parity'
        description: 'Write the network port parity/stop bits for MODBUS Protocol, where: 0 = One stop bit and no parity, default. 1 = One stop bit and even parity. 2 = One stop bit and odd parity. 3 = Two stop bits and no parity.'
        expression: 'ieee754_32(hr:00018 # 2)'

      - id: 'Network port Node'
        description: 'Write the network port node Address: 1 to 247 for MODBUS Protocol, default 1.'
        expression: 'ieee754_32(hr:00020 # 2)'

      - id: 'Network Baud Rate'
        description: 'Write the network port baud rate for MODBUS Protocol, where: 0 = 2400 bps (default. 1 = 4800 bps. 2 = 9600 bps. 5=1200 bps  Data Format：float (length：4 byte)'
        # FIXME: 5=1200 is probably wrong. Missing 3=19200 and 4=38400 ??
        expression: 'ieee754_32(hr:00028 # 2)' # TODO: Is really a FLOAT to ENUM !!! Risk of rounding errors!!!

# TODO: Only when implementing writing values
#  461457 Reset 0xF000
#     00 00: Reset the Maximum demand
#     00 03: Reset the resettable energy
#  WRITE ONLY

      - id: 'Screen settings'
        description: 'A BCD encoded (8 bits per value) of the 4 display settings: Demand interval (minutes), slide time (minutes), automatic scroll display interval (scroll Time)(seconds)，Backlight (minutes)'
        expression: 'hexstring(hr:62720#2)' # TODO: Implement BCD decomposition and splitting the result
#  462721 (F5 00)
#  Demand interval, slide time, automatic scroll display interval (scroll Time)，Backlight
#  min-min-s-min
#  scroll time=0：the display does not scroll automatically.
#  Backlight time=0 Backlight always on
# Data Format: BCD (length：4 byte)

      - id: 'Pulse 1 constant'
        description: 'Pulse 1 constant'
        unit: 'kWh or kVArh per imp'
        expression: 'enum(hr:63760 ; 0 -> ''0.001 kWh (kVArh) /imp'' ; 1 -> ''0.01 kWh (kVArh) /imp'' ; 2 -> ''0.1 kWh (kVArh) /imp'' ; 3 -> ''1 kWh (kVArh) /imp'')'

      - id: 'Measurement mode'
        description: 'Measurement mode'
        expression: 'enum(hr:63776 ; 1 -> ''mode 1 (total = import)'' ; 2 -> ''mode 2 (total = import + export)'' ; 3 -> ''mode 3 (total = import - export)'')'

      - id: 'Running time'
        description: 'Continuous working period'
        unit: 'Hours'
        expression: 'ieee754_32(hr:63792 # 2)'

      - id: 'Serial number'
        description: 'Serial number'
        expression: 'uint32(hr:64512 # 2)'

